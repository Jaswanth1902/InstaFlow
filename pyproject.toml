[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instaflow-agent"
version = "0.1.0"
authors = [
  { name="Jaswanth Reddy", email="jaswanthreddy1537@gmail.com" },
]
description = "The Autonomous Instagram Direct & Lead Intelligence Agent — Slash Commands, <1s Creator Discovery, ManyChat Lead Magnets & Reel Tool Harvester without Cloud Subscriptions"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "instagram",
    "automation",
    "ai-agent",
    "direct-messages",
    "social-intelligence",
    "creator-search",
    "lead-magnet",
    "zero-cloud"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Jaswanth1902/InstaFlow"
"Bug Tracker" = "https://github.com/Jaswanth1902/InstaFlow/issues"

[project.scripts]
instaflow = "instaflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
